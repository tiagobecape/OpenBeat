name: Compilar OpenBeat APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - name: Preparar projeto Android
        run: |
          cd "$RUNNER_TEMP"
          flutter create --platforms=android --org com.tiagobecape --project-name openbeat --empty --no-pub openbeat
          cp "$GITHUB_WORKSPACE/pubspec.yaml" openbeat/
          cp "$GITHUB_WORKSPACE/lib/main.dart" openbeat/lib/
          manifest=openbeat/android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          sed -i 's/android:label="openbeat"/android:label="OpenBeat"/' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
      - name: Verificar e compilar
        run: |
          cd "$RUNNER_TEMP/openbeat"
          flutter pub get
          flutter analyze
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../OpenBeat-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBeat-v0.1-APK
          path: ${{ runner.temp }}/OpenBeat-v0.1-debug.apk
          if-no-files-found: error
